map $request_method $write_key {
  default "";
  POST $binary_remote_addr;
  PUT $binary_remote_addr;
  PATCH $binary_remote_addr;
}
limit_req_zone $write_key zone=writes:1m rate=10r/s;
server {
  listen 8080;
  server_name localhost 127.0.0.1;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 32k;
  client_body_timeout 10s;
  access_log off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Cache-Control no-store always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  if ($host !~ ^(localhost|127\.0\.0\.1|web)$) { return 400; }
  error_page 413 = @large;
  error_page 429 = @rate;
  location @large { default_type application/json; return 413 '{"error":{"code":"request_rejected","violations":[{"code":"body_too_large","field":"","message":"Request body exceeds 32 KiB"}]}}'; }
  location @rate { default_type application/json; return 429 '{"error":{"code":"request_rejected","violations":[{"code":"rate_limit","field":"","message":"Too many writes; retry with the same key"}]}}'; }
  location /api/ {
    limit_req zone=writes burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8000;
    proxy_set_header Host $http_host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
